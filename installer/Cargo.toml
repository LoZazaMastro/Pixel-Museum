[package]
name = "pixel-museum-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Pixel Museum Windows installer"
build = "build.rs"

[features]
preview = []

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rfd = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
